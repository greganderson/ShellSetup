general.import = [ "~/.local/state/omarchy/current/theme/alacritty.toml" ]

[env]
TERM = "xterm-256color"
SHELL = "/usr/bin/zsh"

[font]
normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
size = 9

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
  # Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
  { key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
  # Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
  { key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" }
]

[terminal]
osc52 = "CopyPaste"

[colors.normal]
black = "#0B0C16"
# red = "#b91c1c" # red 700
red = "#991b1b" # red 800
green = "#4fe88f"
yellow = "#eab308" # yellow 500
blue = "#0ea5e9" # sky 500
magenta = "#ec4899"
cyan = "#7cf8f7"
white = "#ddf7ff"

[colors.bright]
black = "#2d3450"
red = "#ef4444" # red 500
green = "#9cf7c2"
yellow = "#fde047" # yellow 300
blue = "#60a5fa" # blue 500
magenta = "#cddbf4"
cyan = "#d1fffe"
white = "#ddf7ff"
